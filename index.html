<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16121B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<title>Наш день</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Наш день">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: uma coluna de celular; o dia vira uma carreira de tricô (cada cuidado é um ponto), o mês vira um mosaico. Um fio liga as duas cidades no topo. */
:root{
  --bg:#F2F0F4; --surface:#FCFBFD; --sunk:#E9E6EE; --ink:#2B2233; --muted:#6C6378; --line:#DAD5E1;
  --cherry:#9C2F4E; --cherry-soft:#F5DFE6; --dusk:#52669A; --dusk-soft:#DEE5F4; --zest:#B9661C; --zest-soft:#F9E7D3;
  --on-accent:#FFFFFF;
  --m1:#4E5C86; --m2:#8E9ABD; --m3:#B3B0BE; --m4:#F4B583; --m5:#DE8F2C;
  --shadow:0 1px 2px rgba(43,34,51,.05),0 10px 28px rgba(43,34,51,.07);
  --f-display:"Oranienbaum","Cormorant Garamond","Georgia","Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:22px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16121B; --surface:#201A27; --sunk:#2A2334; --ink:#EEE9F3; --muted:#A99FB6; --line:#392F45;
  --cherry:#EC8AA3; --cherry-soft:#43212E; --dusk:#A3B4DC; --dusk-soft:#262F47; --zest:#EDA661; --zest-soft:#3E2D1B;
  --on-accent:#2A0F18;
  --m1:#5C6EA4; --m2:#7D8AB2; --m3:#8E859C; --m4:#D9A37C; --m5:#F0AE57;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16121B; --surface:#201A27; --sunk:#2A2334; --ink:#EEE9F3; --muted:#A99FB6; --line:#392F45;
  --cherry:#EC8AA3; --cherry-soft:#43212E; --dusk:#A3B4DC; --dusk-soft:#262F47; --zest:#EDA661; --zest-soft:#3E2D1B;
  --on-accent:#2A0F18;
  --m1:#5C6EA4; --m2:#7D8AB2; --m3:#8E859C; --m4:#D9A37C; --m5:#F0AE57;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--cherry);outline-offset:2px;border-radius:10px}
h1,h2,h3,p{margin:0}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:400;text-wrap:balance;letter-spacing:.01em}
h1{font-size:32px;line-height:1.12}
h2{font-size:23px;line-height:1.2}
h3{font-size:18px;line-height:1.25}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11.5px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}

.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(98px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.app.fade>*{animation:fade .4s ease both}
@keyframes fade{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}

/* topo: o fio entre as duas cidades */
.thread{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.thread b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.thread svg{flex:1;min-width:24px;height:12px}
.thread path{stroke:var(--cherry);stroke-width:1.4;fill:none;stroke-linecap:round;opacity:.75}
.thread .km{font-size:10.5px;letter-spacing:.08em;white-space:nowrap}
.gear{border:0;background:var(--surface);box-shadow:var(--shadow);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* botões e campos */
.btn{border:0;border-radius:15px;padding:13px 18px;font-weight:600;background:var(--cherry);color:var(--on-accent);text-align:center}
.btn.soft{background:var(--sunk);color:var(--ink)}
.btn.rose{background:var(--cherry-soft);color:var(--ink)}
.btn.wide{width:100%}
.link{border:0;background:none;color:var(--cherry);font-weight:600;font-size:13.5px;padding:6px 0;white-space:nowrap;flex:none}
.ghost{border:0;background:none;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:10px}
textarea,input[type=text],input[type=date],input[type=time],select{width:100%;background:var(--sunk);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;font-size:15px;min-width:0}
textarea{resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--cherry);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--cherry-soft);border-color:var(--cherry)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:15px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:12px;padding:9px 6px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--cherry)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}

/* humor */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{background:var(--sunk);border:1.5px solid transparent;border-radius:16px;padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;line-height:1.2;text-align:center;color:var(--muted);min-width:0}
.mood .ic{width:26px;height:26px;color:var(--ink)}
.mood i{width:22px;height:5px;border-radius:9px;display:block}
.mood[aria-pressed="true"]{border-color:var(--cherry);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.mb1{background:var(--m1)}.mb2{background:var(--m2)}.mb3{background:var(--m3)}.mb4{background:var(--m4)}.mb5{background:var(--m5)}
.say{background:var(--zest-soft);border-radius:16px;padding:14px 16px;font-family:var(--f-display);font-size:18px;line-height:1.35}
.gift{background:var(--cherry-soft);border-radius:var(--r);padding:16px 18px;display:flex;gap:12px;align-items:flex-start}
.gift .ic{color:var(--cherry);margin-top:3px}

/* tricô */
.knit{width:100%;height:auto;display:block}
.sc rect{fill:var(--cherry)} .sd rect{fill:var(--dusk)} .sz rect{fill:var(--zest)}
.knit text{fill:var(--muted);font-family:var(--f-body);font-size:9px}
.knit line{stroke:var(--line);stroke-width:1.2;stroke-dasharray:2 4;stroke-linecap:round}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}

/* cuidados */
.cares{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.care{background:var(--surface);border:1.5px solid transparent;border-radius:18px;box-shadow:var(--shadow);padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.care .ic{width:25px;height:25px;color:var(--cherry)}
.care .t{font-size:12.5px;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.care .v{font-size:11px;color:var(--muted);line-height:1.25}
.care[aria-pressed="true"]{background:var(--cherry-soft);border-color:var(--cherry);box-shadow:none}
.water{display:flex;gap:4px;justify-content:center}
.water i{width:8px;height:13px;border:1.4px solid var(--cherry);border-top:0;border-radius:0 0 4px 4px;display:block}
.water i.f{background:var(--cherry)}

/* agora no plano */
.nowcard{background:var(--dusk-soft);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center}
.nowcard .when{font-family:var(--f-display);font-size:26px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.studychip{border:0;width:100%;text-align:left;background:var(--zest-soft);border-radius:var(--r);padding:14px 18px;display:flex;gap:12px;align-items:center}
.studychip .ic{color:var(--zest)}
.hard{border:1.5px dashed var(--line);background:transparent;border-radius:var(--r);padding:15px 16px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.hard .ic{color:var(--dusk);width:26px;height:26px}

/* cronograma */
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd{border:1.5px solid transparent;background:var(--sunk);border-radius:14px;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.wd b{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--ink);line-height:1}
.wd[aria-pressed="true"]{background:var(--surface);border-color:var(--cherry);box-shadow:var(--shadow)}
.wd .dot{width:5px;height:5px;border-radius:50%;background:var(--dusk)}
.wd.soft .dot{background:var(--zest)}
.wd.today b{color:var(--cherry)}
.tl{display:flex;flex-direction:column}
.blk{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk .tm{font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted);padding-top:1px}
.blk .tx{min-width:0;overflow-wrap:anywhere}
.blk .sub{font-size:12px;color:var(--muted)}
.blk.done .tx>span:first-child{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.blk.now .tm{color:var(--cherry);font-weight:700}
.chk{width:26px;height:26px;border-radius:50%;border:1.6px solid var(--dusk);background:transparent;display:grid;place-items:center;flex:none;padding:0}
.chk.on{background:var(--dusk)}
.chk.on::after{content:"";width:9px;height:5px;border:2px solid var(--surface);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.anchor{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--zest);margin-right:6px;vertical-align:middle}
.edit{display:grid;grid-template-columns:104px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.edit:first-child{border-top:0}
.edit .tools{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.task{display:flex;align-items:center;gap:12px;background:var(--sunk);border-radius:14px;padding:10px 12px}
.task .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .tx{color:var(--muted);text-decoration:line-through}
.addrow{display:flex;gap:8px}
.addrow .btn{padding:12px 16px}

/* estudo */
.flash{border:0;width:100%;background:var(--zest-soft);border-radius:var(--r);padding:26px 18px;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.flash .w{font-family:var(--f-display);font-size:30px;line-height:1.15;overflow-wrap:anywhere}
.flash .p{font-size:14px;color:var(--muted)}
.sday{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.sday:first-child{border-top:0}
.sday .d{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sday.today .d{color:var(--cherry);font-weight:700}
.sday .chk{border-color:var(--zest)} .sday .chk.on{background:var(--zest)}
.sday .chk:disabled{opacity:.3}

/* nós */
.q{font-family:var(--f-display);font-size:22px;line-height:1.28}
.locked{background:var(--sunk);border-radius:14px;padding:13px 14px;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13.5px}
.answer{background:var(--cherry-soft);border-radius:14px;padding:13px 14px;font-size:14.5px}
.answer.his{background:var(--dusk-soft)}
.big{font-family:var(--f-display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.road{position:relative;height:22px}
.road::before{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line);border-radius:2px}
.road i{position:absolute;left:0;top:10px;height:2px;background:var(--cherry);border-radius:2px}
.road b{position:absolute;top:4px;width:14px;height:14px;border-radius:50%;background:var(--cherry);border:3px solid var(--surface);transform:translateX(-50%)}
.acts{display:flex;flex-direction:column}
.act{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .n{font-weight:600} .act .f{font-size:11px;color:var(--muted);align-self:center;text-transform:uppercase;letter-spacing:.08em}
.act .d{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.quick{display:flex;flex-direction:column;gap:8px}
.quick button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.quick button span:last-child{color:var(--muted);font-size:12.5px;text-align:right}

/* pausa */
.exbtn{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:15px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;width:100%}
.exbtn .n{font-weight:600} .exbtn .m{font-size:12px;color:var(--muted)} .exbtn .d{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.orbw{display:grid;place-items:center;min-height:250px}
.orb{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--zest-soft),var(--cherry-soft) 62%,var(--cherry) 150%);box-shadow:0 0 0 18px color-mix(in srgb,var(--cherry-soft) 55%,transparent);transition:transform 4s ease-in-out}
.orb.in{transform:scale(1.7)} .orb.out{transform:scale(1);transition-duration:6s}
.phase{font-family:var(--f-display);font-size:22px;text-align:center;min-height:30px}

/* diário: mosaico */
.mosaic{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mosaic .h{font-size:10.5px;text-align:center;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile{aspect-ratio:1;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.f{border:0;color:#fff}
.tile.f.t3,.tile.f.t4,.tile.f.t5{color:#2B2233}
.tile.t1{background:var(--m1)}.tile.t2{background:var(--m2)}.tile.t3{background:var(--m3)}.tile.t4{background:var(--m4)}.tile.t5{background:var(--m5)}
.tile.now{outline:2px solid var(--cherry);outline-offset:1px}
.tile.fut{border-style:solid;opacity:.45}
.entry{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:5px}
.entry:first-child{border-top:0;padding-top:0}
.badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--zest-soft);border-radius:99px;padding:2px 8px;font-weight:600}
.notex{background:var(--zest-soft);border-radius:14px;padding:10px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}

/* resultados */
.hero{font-family:var(--f-display);font-size:68px;line-height:.9;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--sunk);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.15;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted);line-height:1.3}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:9px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .avg{stroke:var(--cherry);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chart .gl{stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chart .dot{stroke:var(--surface)}
.fm1{fill:var(--m1)}.fm2{fill:var(--m2)}.fm3{fill:var(--m3)}.fm4{fill:var(--m4)}.fm5{fill:var(--m5)}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:9px 10px;align-items:center;font-size:13px}
.bars .b{height:14px;border-radius:0 4px 4px 0;min-width:3px}
.bars .n{font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(7,1fr);height:118px;border-bottom:1px solid var(--line)}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.col i{display:block;width:22px;border-radius:4px 4px 0 0;background:var(--m2)}
.col.best i{background:var(--cherry)}
.collab{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lineleg{display:inline-block;width:16px;height:2px;background:var(--cherry);border-radius:2px;vertical-align:middle}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t td,table.t th{text-align:left;padding:6px 0;border-top:1px solid var(--line);font-weight:400}
table.t td:last-child,table.t th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tip{position:fixed;z-index:70;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 10px;border-radius:10px;pointer-events:none;transform:translate(-50%,calc(-100% - 8px));white-space:nowrap}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;min-width:0;color:var(--muted);padding:4px 0}
.tab[aria-selected="true"]{color:var(--cherry);font-weight:700}

/* camadas */
.layer{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding:calc(22px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.layer .in{max-width:444px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.choice{display:flex;flex-direction:column;gap:8px}
.choice button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:15px;text-align:left;font-size:15px}
.choice button[aria-pressed="true"]{border-color:var(--cherry);background:var(--cherry-soft)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.profiles button{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left}
.profiles button[aria-pressed="true"]{border-color:var(--cherry);background:var(--cherry-soft)}
.profiles b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14px;z-index:60;transition:.3s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
ol.guide{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 rem:function(v,el){S.reminders[v]=!S.reminders[v];el.setAttribute("aria-checked",S.reminders[v]);save()},
 clearex:function(){Object.keys(S.days).forEach(function(k){if(S.days[k].example)delete S.days[k]});Object.keys(S.answers).forEach(function(k){if(S.answers[k].example)delete S.answers[k]});
  S.gifts.ana=S.gifts.ana.filter(function(g){return !g.example});(S.study.ex||[]).forEach(function(x){delete S.study.log[x[0]][x[1]]});S.study.ex=[];S.steps={ana:0,gab:0};save();render()}
};
document.addEventListener("click",function(ev){var b=ev.target.closest("[data-a]");if(!b||b.disabled)return;var f=A[b.dataset.a];if(f)f(b.dataset.v,b,ev)});
/* campos de texto: salvam sem redesenhar a tela, para não perder o foco */
var F={
 note:function(v){day().note=v},sperson:function(v){S.support.person=v},spro:function(v){S.support.pro=v},
 bt:function(v,el){var b=findBlk(el.dataset.id);if(b&&v)b.t=v},
 bx:function(v,el){var b=findBlk(el.dataset.id);if(b){b.ru=v;b.pt=v}},
 tz:function(v){S.tz=v;save();render()},meet:function(v){S.meet=v;save();render()}
};
function onField(ev){var el=ev.target,f=el.dataset&&F[el.dataset.f];if(!f)return;if((el.dataset.f==="tz"||el.dataset.f==="meet")&&ev.type!=="change")return;f(el.value,el);save()}
document.addEventListener("input",onField);document.addEventListener("change",onField);
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target.id==="newp")A.padd();if(ev.key==="Enter"&&ev.target.id==="newh")A.hadd();if(ev.key==="Escape"&&ui.layer)A.close()});

/* balão de valor nos gráficos (toque ou passe o dedo) */
var tip=document.createElement("div");tip.className="tip";tip.hidden=true;document.body.appendChild(tip);
function tipOn(ev){var t=ev.target.closest&&ev.target.closest("[data-tip]");if(!t){tip.hidden=true;return}
 tip.textContent=t.getAttribute("data-tip");tip.hidden=false;var r=t.getBoundingClientRect();
 tip.style.left=Math.min(window.innerWidth-80,Math.max(80,r.left+r.width/2))+"px";tip.style.top=r.top+"px"}
document.addEventListener("pointerover",tipOn);document.addEventListener("pointerdown",tipOn);
document.addEventListener("scroll",function(){tip.hidden=true},true);

render();
setInterval(function(){var t=document.getElementById("thread");if(t)t.innerHTML=threadHtml()},30000);
})();
</script>
